server:
  port: 8081
spring:
  application:
    name: ai-open-platform
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/token_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 20030226
  redis:
    host: localhost
    port: 6370
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.aiopenplatform.entity # 别名扫描包
logging:
  level:
    com.aiopenplatform: debug
  pattern:
    dateformat: mm:ss.SSS

# ============ Memcached：多级缓存 L2 ============
memcached:
  servers: 127.0.0.1:11211
  pool-size: 5
  op-timeout: 2000 # 单次操作超时 ms

# ============ Canal：binlog 驱动缓存同步 ============
canal:
  # 总开关：false 时停用 binlog 同步，写路径降级为 Cache Aside（手动删缓存）
  enabled: true
  server:
    host: 127.0.0.1
    port: 11111
  destination: example
  batch-size: 100
  # 注意：YAML plain scalar 不做转义，此处为单反斜杠（Java 正则中 \. 匹配字面点）
  # tb_user_quota 不在 tb_token_* 前缀内，需单独纳入订阅（权益扣减后缓存失效依赖它）
  filter: token_platform\.(tb_token_.*|tb_user_quota)

# ============ 应用配置 ============
app:
  # 图片上传根目录（相对项目根目录，与 nginx 前端静态目录一致）
  upload-dir: nginx-1.18.0/html/token/imgs/

# ============ 管理后台 ============
# 管理员手机号白名单（逗号分隔）：登录后 /admin/** 接口按此校验
admin:
  phones: 13686869696
