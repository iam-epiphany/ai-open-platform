server:
  port: 8081
spring:
  application:
    name: ai-open-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/token_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:20030226}
  redis:
    host: localhost
    port: 6370
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.aiopenplatform.entity # 别名扫描包
logging:
  level:
    com.aiopenplatform: debug
  pattern:
    dateformat: mm:ss.SSS

# ============ Canal：binlog 驱动缓存同步 ============
canal:
  # 总开关：false 时停用 binlog 同步，写路径降级为 Cache Aside（手动删缓存）
  enabled: true
  server:
    host: 127.0.0.1
    port: 11111
  destination: example
  batch-size: 100
  # 注意：YAML plain scalar 不做转义，此处为单反斜杠（Java 正则中 \. 匹配字面点）
  filter: token_platform\.tb_token_.*

# ============ 应用配置 ============
app:
  # 图片上传根目录（相对项目根目录，与 nginx 前端静态目录一致）
  upload-dir: nginx-1.18.0/html/token/imgs/

# ============ 管理后台 ============
# 管理员账号密码登录（POST /admin/login）：账号密码与 admin.phones 手机号白名单两种方式均可进入管理后台
# 演示项目密码明文存储，生产环境建议改为 PasswordEncoder.encode() 的盐@密文格式（matches 校验自动兼容）
admin:
  username: admin
  password: ${ADMIN_PASSWORD:123456}
  phones: 13686869696

# ============ AI Gateway ============
# 将 DEEPSEEK_API_KEY 写入系统环境变量，避免把真实密钥提交到版本库。
ai:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
