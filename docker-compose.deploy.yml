# AI-OpenPlatform 一键部署：MySQL(5.7, binlog) + Redis + Canal + 后端 App + 前端 Nginx
# 用法：docker compose -f docker-compose.deploy.yml up -d --build
# 打开：前端 http://localhost:8080 ；后端直连 http://localhost:8081
# 说明：
#   - 中间件配置与开发版 docker-compose.yml 保持一致（同一套 docker/canal、docker/mysql 配置）；
#   - MySQL/Redis 数据放入命名卷，容器重建不丢数据；
#   - canal-server 通过宿主回环访问 MySQL（instance.properties 固定 host.docker.internal:3307，
#     故需 extra_hosts: host-gateway 映射，Docker Desktop 与 Linux 均可用）；
#   - 后端需真实模型调用时设置 DEEPSEEK_API_KEY 环境变量。
services:
  mysql:
    image: mysql:5.7
    container_name: aiop-mysql
    ports:
      - "3307:3306"
    environment:
      # 与 .env 的 MYSQL_PASSWORD 保持一致；healthcheck 仍用固定默认值，改密码时需同步
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-20030226}
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      # 兼容 token_base.sql 中 timestamp 的 0000-00-00 默认值
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./src/main/resources/db/credit_platform.sql:/docker-entrypoint-initdb.d/04-credit_platform.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p20030226"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aiop-redis
    ports:
      - "6370:6379"
    command: redis-server --requirepass 123456 --appendonly yes
    volumes:
      - redis-data:/data

  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: aiop-canal
    ports:
      - "11110:11110"
      - "11111:11111"
      - "11112:11112"
    volumes:
      - ./docker/canal/conf/example/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    extra_hosts:
      # instance.properties 中 canal.instance.master.address = host.docker.internal:3307
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    image: ai-open-platform:latest
    container_name: aiop-app
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-20030226}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      canal-server:
        condition: service_started

  frontend:
    image: nginx:1.27-alpine
    container_name: aiop-frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx-1.18.0/html:/usr/share/nginx/html:ro
      - ./docker/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
