#################################################
## Canal 实例配置（example）：监听本地 MySQL 的 token 业务表 binlog
#################################################

# mysql serverId（多实例需唯一；0 表示自动生成）
canal.instance.mysql.slaveId = 1234

# enable gtid use true/false
canal.instance.gtidon = false

# position info：连演示环境 MySQL（docker-compose 的 mysql 服务，宿主机映射 3307）
canal.instance.master.address = host.docker.internal:3307
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.timestamp =
canal.instance.master.gtid =

# rds oss binlog（不使用）
canal.instance.rds.accesskey =
canal.instance.rds.secretkey =
canal.instance.rds.instanceId =

# table meta tsdb info（H2 内嵌）
canal.instance.tsdb.enable = true
canal.instance.tsdb.url = jdbc:h2:${canal.file.data.dir:../conf}/${canal.instance.destination:}h2;CACHE_SIZE=1000;MODE=MYSQL;
canal.instance.tsdb.dbUsername = canal
canal.instance.tsdb.dbPassword = canal
canal.instance.tsdb.spring.xml = classpath:spring/tsdb/h2-tsdb.xml

# username/password：需先在 MySQL 创建 canal 账号（见 README）
canal.instance.dbUsername = canal
canal.instance.dbPassword = canal
canal.instance.connectionCharset = UTF-8
# enable druid Decrypt algorithm
canal.instance.enableDruid = false

# table regex：只订阅 dawang-dianping 库的 token 业务表
canal.instance.filter.regex = dawang-dianping\\.tb_token_.*
# table black regex
canal.instance.filter.black.regex =

# table field filter（不使用）
#canal.instance.filter.field =
#canal.instance.filter.black.field =

# mq config（不使用）
canal.mq.topic = example
canal.mq.partition = 0
canal.mq.enable = false
canal.mq.flatMessage = true

# ldap（不使用）
canal.ldap.enable = false

# alarm（关闭）
canal.alarmSwitch = false
