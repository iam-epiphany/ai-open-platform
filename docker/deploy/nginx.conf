# AI-OpenPlatform 部署版前端入口（挂载到 nginx 镜像 /etc/nginx/conf.d/default.conf）
# 静态页在 /usr/share/nginx/html/token，/api 反代到 compose 的 app 服务（8081）
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html/token;
        index  index.html index.htm;
    }

    location /api {
        default_type  application/json;
        keepalive_timeout   30s;
        keepalive_requests  1000;
        proxy_http_version 1.1;
        rewrite /api(/.*) $1 break;
        # 追加真实来源 IP 到 X-Forwarded-For 末尾，后端取最后一段作为客户端 IP，防止伪造
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://app:8081;
    }
}
