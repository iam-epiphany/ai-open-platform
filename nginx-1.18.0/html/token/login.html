<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - AI 开放平台</title>
  <link rel="stylesheet" href="css/element.css">
  <link rel="stylesheet" href="css/token.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>
<div id="app" v-cloak class="login-page">
  <div class="login-card">
    <h1 class="login-title">⚡ AI 开放平台</h1>
    <p class="login-sub">手机号验证码登录 · 新用户自动注册</p>

    <el-form @submit.native.prevent>
      <el-form-item>
        <el-input v-model.trim="phone" placeholder="请输入手机号" maxlength="11" clearable size="medium">
          <i slot="prefix" class="el-icon-mobile-phone"></i>
        </el-input>
      </el-form-item>
      <el-form-item>
        <div style="display:flex; gap:10px;">
          <el-input v-model.trim="code" placeholder="6 位验证码" maxlength="6" size="medium">
            <i slot="prefix" class="el-icon-message"></i>
          </el-input>
          <el-button size="medium" :disabled="countdown > 0" style="width:130px;" @click="sendCode">
            {{ countdown > 0 ? countdown + 's 后重发' : '获取验证码' }}
          </el-button>
        </div>
      </el-form-item>
      <el-button type="primary" size="medium" style="width:100%;" :loading="submitting" @click="login">
        登 录
      </el-button>
    </el-form>

    <p class="login-tip">
      提示：验证码 5 分钟内有效；连续输错 5 次将限制登录 30 分钟，请勿反复试错。
    </p>
  </div>
</div>

<script src="js/vue.js"></script>
<script src="js/element.js"></script>
<script src="js/axios.min.js"></script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
  Vue.use(ELEMENT);
  new Vue({
    el: '#app',
    data: function () {
      return {
        phone: '',
        code: '',
        countdown: 0,
        submitting: false,
        timer: null
      };
    },
    destroyed: function () {
      if (this.timer) clearInterval(this.timer);
    },
    methods: {
      sendCode: function () {
        if (!/^1[3-9]\d{9}$/.test(this.phone)) {
          ELEMENT.Message.warning('请输入正确的手机号');
          return;
        }
        var self = this;
        api.sendCode(this.phone).then(function () {
          ELEMENT.Message.success('验证码已发送，请注意查收');
          self.countdown = 60;
          self.timer = setInterval(function () {
            self.countdown--;
            if (self.countdown <= 0) clearInterval(self.timer);
          }, 1000);
        }).catch(showError);
      },
      login: function () {
        if (!/^1[3-9]\d{9}$/.test(this.phone)) {
          ELEMENT.Message.warning('请输入正确的手机号');
          return;
        }
        if (!/^\d{6}$/.test(this.code)) {
          ELEMENT.Message.warning('请输入 6 位验证码');
          return;
        }
        var self = this;
        this.submitting = true;
        api.login(this.phone, this.code).then(function (res) {
          sessionStorage.setItem('token', res.data);
          ELEMENT.Message.success('登录成功');
          var redirect = new URLSearchParams(location.search).get('redirect');
          location.href = redirect || '/index.html';
        }).catch(showError).then(function () {
          self.submitting = false;
        });
      }
    }
  });
</script>
</body>
</html>
